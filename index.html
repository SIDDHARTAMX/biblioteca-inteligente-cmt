<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#56212F">
<title>Biblioteca Inteligente CMT</title>
<style>
:root{
  --g:#56212F;--d:#977E5B;--b:#DFD0B9;--f:#F5F2EE;
  --v:#247A3B;--r:#AE2E24;--c:#D6D1CA;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--f);color:#222}
header{background:var(--g);color:#fff;padding:18px 22px}
header h1{margin:0;font-size:1.4rem}
header p{margin:5px 0 0;opacity:.85}
main{max-width:1220px;margin:auto;padding:18px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
button{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}
.tab{background:#ddd;color:#222}
.tab.activa,.primario{background:var(--g);color:#fff}
.secundario{background:var(--d);color:#fff}
.claro{background:var(--c);color:#222}
.panel{background:#fff;border-radius:16px;padding:18px;box-shadow:0 6px 20px rgba(0,0,0,.08);margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.fila{display:flex;gap:8px;flex-wrap:wrap}
input,select,textarea{width:100%;padding:12px;border:1px solid #bbb;border-radius:10px;font:inherit}
textarea{min-height:90px}
.resultados{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:13px;margin-top:15px}
.card{border:1px solid #ddd;border-radius:14px;padding:15px;background:#fff}
.card h3{color:var(--g);margin:0 0 8px}
.estado{margin-top:10px;color:#555}
.ok{color:var(--v);font-weight:700}
.error{color:var(--r);font-weight:700}
.oculto{display:none}
.api-status{padding:9px 12px;border-radius:10px;background:rgba(255,255,255,.14);display:inline-block;margin-top:10px}
.portada{max-width:150px;border-radius:10px;display:none;margin:12px 0}
.coincidencia{border:1px solid #ddd;border-radius:13px;padding:14px;margin-top:10px}
@media(max-width:700px){
 .grid,.grid4{grid-template-columns:1fr}
 .fila>*{width:100%}
}
</style>
</head>
<body>
<header>
  <h1>Biblioteca Inteligente CMT</h1>
  <p>Catálogo, usuarios, préstamos, devoluciones, ubicaciones y registro inteligente</p>
  <div id="estadoApi" class="api-status">Comprobando backend…</div>
</header>

<main>
<div class="tabs">
  <button class="tab activa" onclick="ver('catalogo',this)">Catálogo</button>
  <button class="tab" onclick="ver('registroLibro',this)">Registrar libro</button>
  <button class="tab" onclick="ver('usuarios',this)">Usuarios</button>
  <button class="tab" onclick="ver('prestamos',this)">Préstamos</button>
  <button class="tab" onclick="ver('devoluciones',this)">Devoluciones</button>
  <button class="tab" onclick="ver('ubicaciones',this)">Ubicaciones</button>
</div>

<section id="catalogo" class="panel">
  <h2>Buscar libros</h2>
  <div class="fila">
    <input id="qLibro" placeholder="Título, autor o ISBN">
    <button class="primario" onclick="buscarLibro()">Buscar</button>
  </div>
  <div id="estadoLibro" class="estado"></div>
  <div id="resLibros" class="resultados"></div>
</section>

<section id="registroLibro" class="panel oculto">
  <h2>Registro inteligente por ISBN</h2>
  <div class="grid">
    <input id="riIsbnConsulta" placeholder="ISBN de 10 o 13 dígitos">
    <input id="riClave" type="password" placeholder="Clave administrativa">
  </div>
  <div class="fila" style="margin-top:10px">
    <button class="primario" onclick="consultarISBN()">Consultar ISBN</button>
    <button class="claro" onclick="limpiarRegistroLibro()">Limpiar</button>
  </div>
  <div id="riEstadoConsulta" class="estado"></div>
  <div id="riCoincidencias"></div>

  <hr style="margin:22px 0;border:0;border-top:1px solid #ddd">

  <img id="riPortadaVista" class="portada" alt="Portada">
  <div class="grid">
    <input id="riTitulo" placeholder="Título *">
    <input id="riAutor" placeholder="Autor">
    <input id="riEditorial" placeholder="Editorial">
    <input id="riAnio" placeholder="Año">
    <input id="riIsbnFinal" placeholder="ISBN">
    <select id="riTipo">
      <option>Libro</option>
      <option>Antología</option>
      <option>Audio</option>
      <option>Multimedia</option>
    </select>
    <input id="riSeccion" placeholder="Sección o tema">
    <input id="riNivel" placeholder="Nivel educativo">
    <input id="riPalabras" placeholder="Palabras clave">
    <input id="riPortada" placeholder="URL de portada">
  </div>
  <div style="margin-top:10px">
    <textarea id="riDescripcion" placeholder="Descripción"></textarea>
  </div>

  <h3 style="margin-top:22px">Ubicación del ejemplar</h3>
  <div class="grid4">
    <input id="riSala" placeholder="Sala">
    <input id="riEstante" placeholder="Estante">
    <input id="riRepisa" placeholder="Repisa">
    <input id="riPosicion" placeholder="Posición">
  </div>
  <div class="grid" style="margin-top:10px">
    <select id="riCondicion">
      <option>Excelente</option>
      <option selected>Bueno</option>
      <option>Regular</option>
      <option>Dañado</option>
    </select>
    <input id="riObservaciones" placeholder="Observaciones">
  </div>
  <button class="primario" style="margin-top:12px" onclick="registrarLibroInteligente()">Guardar libro y ejemplar</button>
  <div id="riEstadoRegistro" class="estado"></div>
</section>

<section id="usuarios" class="panel oculto">
  <h2>Registrar usuario</h2>
  <div class="grid">
    <input id="uNombre" placeholder="Nombre completo">
    <select id="uTipo"><option>Docente</option><option>Estudiante</option><option>Administrativo</option><option>Visitante</option></select>
    <input id="uInstitucion" placeholder="Institución">
    <input id="uTelefono" placeholder="Teléfono">
    <input id="uCorreo" placeholder="Correo">
    <input id="uObs" placeholder="Observaciones">
  </div>
  <div style="margin-top:10px"><input id="claveUsuarios" type="password" placeholder="Clave administrativa"></div>
  <button class="primario" style="margin-top:10px" onclick="registrarUsuario()">Guardar usuario</button>
  <div id="estadoUsuario" class="estado"></div>
</section>

<section id="prestamos" class="panel oculto">
  <h2>Registrar préstamo</h2>
  <div class="grid">
    <input id="pEjemplar" placeholder="Código de ejemplar">
    <input id="pUsuario" placeholder="Código de usuario">
    <input id="pDias" type="number" value="7" min="1" placeholder="Días">
    <input id="pResponsable" placeholder="Responsable">
  </div>
  <div style="margin-top:10px"><input id="clavePrestamo" type="password" placeholder="Clave administrativa"></div>
  <button class="primario" style="margin-top:10px" onclick="registrarPrestamo()">Registrar préstamo</button>
  <div id="estadoPrestamo" class="estado"></div>
</section>

<section id="devoluciones" class="panel oculto">
  <h2>Préstamos activos</h2>
  <div class="fila">
    <input id="qPrestamo" placeholder="Título, usuario, préstamo o ejemplar">
    <input id="claveDevolucion" type="password" placeholder="Clave administrativa">
    <button class="primario" onclick="cargarPrestamos()">Buscar</button>
  </div>
  <div id="estadoDevolucion" class="estado"></div>
  <div id="listaPrestamos" class="resultados"></div>
</section>

<section id="ubicaciones" class="panel oculto">
  <h2>Asignar ubicación</h2>
  <div class="grid4">
    <input id="ubEjemplar" placeholder="Código de ejemplar">
    <input id="ubSala" placeholder="Sala">
    <input id="ubEstante" placeholder="Estante">
    <input id="ubRepisa" placeholder="Repisa">
    <input id="ubPosicion" placeholder="Posición">
    <input id="claveUbicacion" type="password" placeholder="Clave administrativa">
  </div>
  <button class="primario" style="margin-top:10px" onclick="guardarUbicacion()">Guardar ubicación</button>
  <div id="estadoUbicacion" class="estado"></div>
</section>
</main>

<script>
const API_URL='https://script.google.com/macros/s/AKfycbz6O-vI27BanC1bU8g1rOwYwzqZFmkocc07NrnesRFd6uJ3x8Y07W3FHeBJmgqMrLGNkg/exec';

function jsonp(params){
 return new Promise((resolve,reject)=>{
  const cb='cb_'+Date.now()+'_'+Math.floor(Math.random()*9999);
  const s=document.createElement('script');
  const u=new URL(API_URL);
  Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v??''));
  u.searchParams.set('callback',cb);
  const limpiar=()=>{delete window[cb];s.remove()};
  window[cb]=r=>{limpiar();r&&r.ok?resolve(r.datos):reject(new Error((r&&r.error)||'Error'))};
  s.onerror=()=>{limpiar();reject(new Error('No se pudo conectar con Apps Script.'))};
  s.src=u.toString();document.body.appendChild(s);
 });
}

function esc(t){return String(t??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}

function ver(id,b){
 document.querySelectorAll('section').forEach(x=>x.classList.add('oculto'));
 document.getElementById(id).classList.remove('oculto');
 document.querySelectorAll('.tab').forEach(x=>x.classList.remove('activa'));
 b.classList.add('activa');
}

async function comprobarVersion(){
 const e=document.getElementById('estadoApi');
 try{const r=await jsonp({accion:'version'});e.textContent='Backend conectado: '+r.version;e.className='api-status ok'}
 catch(err){e.textContent='Error de backend: '+err.message;e.className='api-status error'}
}

async function buscarLibro(){
 const q=qLibro.value.trim();estadoLibro.textContent='Buscando…';
 try{
  const r=await jsonp({accion:'buscar',q});
  estadoLibro.textContent=r.length+' resultado(s).';
  resLibros.innerHTML=r.map(x=>`<article class="card"><h3>${esc(x.titulo)}</h3><div><b>Autor:</b> ${esc(x.autor)}</div><div><b>Disponibles:</b> ${x.disponibles} de ${x.totalEjemplares}</div>${(x.ejemplaresDisponibles||[]).map(e=>`<div>📘 ${esc(e.idEjemplar)} · ${esc(e.ubicacion)}</div>`).join('')}</article>`).join('');
 }catch(err){estadoLibro.textContent=err.message;estadoLibro.className='estado error'}
}

async function consultarISBN() {
  const estado = document.getElementById('riEstadoConsulta');

  const isbn = document
    .getElementById('riIsbnConsulta')
    .value
    .replace(/[^0-9Xx]/g, '')
    .toUpperCase()
    .trim();

  estado.className = 'estado';

  if (isbn.length !== 10 && isbn.length !== 13) {
    estado.textContent = 'El ISBN debe contener 10 o 13 caracteres.';
    estado.className = 'estado error';
    return;
  }

  estado.textContent = 'Consultando Google Books…';
  document.getElementById('riCoincidencias').innerHTML = '';

  try {
    const url =
      'https://www.googleapis.com/books/v1/volumes' +
      '?q=' + encodeURIComponent('isbn:' + isbn) +
      '&maxResults=5';

    const respuesta = await fetch(url);

    if (!respuesta.ok) {
      throw new Error(
        'Google Books respondió con el código ' +
        respuesta.status
      );
    }

    const datos = await respuesta.json();

    if (!datos.items || datos.items.length === 0) {
      estado.textContent =
        'No se encontró información para este ISBN. ' +
        'Puedes capturar los datos manualmente.';

      document.getElementById('riIsbnFinal').value = isbn;
      return;
    }

    const coincidencias = datos.items.map(item => {
      const info = item.volumeInfo || {};
      const identificadores = info.industryIdentifiers || [];

      const obtenerISBN = tipo => {
        const encontrado = identificadores.find(
          elemento => elemento.type === tipo
        );

        return encontrado ? encontrado.identifier : '';
      };

      const coincidenciaAnio = String(
        info.publishedDate || ''
      ).match(/(19|20)\d{2}/);

      const portada =
        info.imageLinks &&
        (
          info.imageLinks.thumbnail ||
          info.imageLinks.smallThumbnail
        )
          ? String(
              info.imageLinks.thumbnail ||
              info.imageLinks.smallThumbnail
            ).replace('http://', 'https://')
          : '';

      return {
        titulo: info.title || '',
        autores: Array.isArray(info.authors)
          ? info.authors.join(', ')
          : '',
        editorial: info.publisher || '',
        anio: coincidenciaAnio
          ? coincidenciaAnio[0]
          : '',
        isbn13: obtenerISBN('ISBN_13'),
        isbn10: obtenerISBN('ISBN_10'),
        categorias: Array.isArray(info.categories)
          ? info.categories.join(', ')
          : '',
        descripcion: info.description || '',
        portada: portada
      };
    });

    estado.textContent =
      coincidencias.length +
      ' coincidencia(s) encontrada(s).';

    document.getElementById('riCoincidencias').innerHTML =
      coincidencias.map(libro => `
        <div class="coincidencia">
          <b>${esc(libro.titulo)}</b>

          <div>
            ${esc(libro.autores)}
          </div>

          <div>
            ${esc(libro.editorial)}
            ${libro.anio
              ? ' · ' + esc(libro.anio)
              : ''}
          </div>

          <button
            class="secundario"
            style="margin-top:8px"
            onclick='usarFicha(${JSON.stringify(libro)})'>
            Usar esta ficha
          </button>
        </div>
      `).join('');

    usarFicha(coincidencias[0]);

  } catch (error) {
    estado.textContent =
      'No se pudo consultar Google Books: ' +
      error.message;

    estado.className = 'estado error';
  }
}
function usarFicha(x){
 riTitulo.value=x.titulo||'';riAutor.value=x.autores||'';riEditorial.value=x.editorial||'';
 riAnio.value=x.anio||'';riIsbnFinal.value=x.isbn13||x.isbn10||riIsbnConsulta.value;
 riSeccion.value=x.categorias||'';riPalabras.value=x.categorias||'';
 riDescripcion.value=x.descripcion||'';riPortada.value=x.portada||'';
 if(x.portada){riPortadaVista.src=x.portada;riPortadaVista.style.display='block'}
}

async function registrarLibroInteligente(){
 riEstadoRegistro.textContent='Guardando…';riEstadoRegistro.className='estado';
 try{
  const r=await jsonp({
   accion:'registrarLibroInteligente',clave:riClave.value,titulo:riTitulo.value,autor:riAutor.value,
   editorial:riEditorial.value,anio:riAnio.value,isbn:riIsbnFinal.value,tipoMaterial:riTipo.value,
   seccion:riSeccion.value,nivel:riNivel.value,palabrasClave:riPalabras.value,
   descripcion:riDescripcion.value,portada:riPortada.value,sala:riSala.value,
   estante:riEstante.value,repisa:riRepisa.value,posicion:riPosicion.value,
   condicion:riCondicion.value,observaciones:riObservaciones.value
  });
  riEstadoRegistro.textContent=r.mensaje+' Título: '+r.idTitulo+' · Ejemplar: '+r.idEjemplar+' · '+r.ubicacion;
  riEstadoRegistro.className='estado ok';
 }catch(err){riEstadoRegistro.textContent=err.message;riEstadoRegistro.className='estado error'}
}

function limpiarRegistroLibro(){
 ['riIsbnConsulta','riTitulo','riAutor','riEditorial','riAnio','riIsbnFinal','riSeccion','riNivel','riPalabras','riPortada','riDescripcion','riSala','riEstante','riRepisa','riPosicion','riObservaciones'].forEach(id=>document.getElementById(id).value='');
 riCoincidencias.innerHTML='';riEstadoConsulta.textContent='';riEstadoRegistro.textContent='';
 riPortadaVista.style.display='none';riPortadaVista.removeAttribute('src');
}

async function registrarUsuario(){
 estadoUsuario.textContent='Guardando…';
 try{const r=await jsonp({accion:'registrarUsuario',clave:claveUsuarios.value,nombre:uNombre.value,tipo:uTipo.value,institucion:uInstitucion.value,telefono:uTelefono.value,correo:uCorreo.value,observaciones:uObs.value});estadoUsuario.textContent=r.mensaje+' Código: '+r.idUsuario;estadoUsuario.className='estado ok'}
 catch(err){estadoUsuario.textContent=err.message;estadoUsuario.className='estado error'}
}

async function registrarPrestamo(){
 estadoPrestamo.textContent='Guardando…';
 try{const r=await jsonp({accion:'registrarPrestamo',clave:clavePrestamo.value,idEjemplar:pEjemplar.value,idUsuario:pUsuario.value,dias:pDias.value,responsable:pResponsable.value});estadoPrestamo.textContent=r.mensaje+' '+r.idPrestamo+'. Fecha límite: '+r.fechaLimite;estadoPrestamo.className='estado ok'}
 catch(err){estadoPrestamo.textContent=err.message;estadoPrestamo.className='estado error'}
}

async function cargarPrestamos(){
 estadoDevolucion.textContent='Cargando…';
 try{
  const r=await jsonp({accion:'prestamosActivos',clave:claveDevolucion.value,q:qPrestamo.value});
  estadoDevolucion.textContent=r.length+' préstamo(s) activo(s).';
  listaPrestamos.innerHTML=r.map(x=>`<article class="card"><h3>${esc(x.titulo)}</h3><div><b>Usuario:</b> ${esc(x.usuario)}</div><div><b>Ejemplar:</b> ${esc(x.idEjemplar)}</div><div><b>Préstamo:</b> ${esc(x.idPrestamo)}</div><div><b>Fecha límite:</b> ${esc(x.fechaLimite)}</div><button class="secundario" style="margin-top:10px" onclick="devolver('${esc(x.idPrestamo)}')">Registrar devolución</button><div id="m_${esc(x.idPrestamo)}" class="estado"></div></article>`).join('');
 }catch(err){estadoDevolucion.textContent=err.message;estadoDevolucion.className='estado error'}
}

async function devolver(id){
 const e=document.getElementById('m_'+id);e.textContent='Procesando…';
 try{const r=await jsonp({accion:'registrarDevolucion',clave:claveDevolucion.value,idPrestamo:id});e.textContent=r.mensaje+' Retraso: '+r.diasRetraso+' día(s).';e.className='estado ok'}
 catch(err){e.textContent=err.message;e.className='estado error'}
}

async function guardarUbicacion(){
 estadoUbicacion.textContent='Guardando…';
 try{const r=await jsonp({accion:'guardarUbicacion',clave:claveUbicacion.value,idEjemplar:ubEjemplar.value,sala:ubSala.value,estante:ubEstante.value,repisa:ubRepisa.value,posicion:ubPosicion.value});estadoUbicacion.textContent=r.mensaje+' '+r.ubicacion;estadoUbicacion.className='estado ok'}
 catch(err){estadoUbicacion.textContent=err.message;estadoUbicacion.className='estado error'}
}

window.addEventListener('load',comprobarVersion);
</script>
</body>
</html>
