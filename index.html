<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#56212F">
<title>Biblioteca Inteligente CMT</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--g:#56212F;--d:#977E5B;--b:#DFD0B9;--f:#F7F4F0;--v:#247A3B;--r:#AE2E24}*{box-sizing:border-box}body{margin:0;font-family:Arial;background:var(--f);color:#222}header{background:linear-gradient(135deg,var(--g),#31131b);color:#fff;padding:20px;box-shadow:0 3px 14px #0004}.wrap{max-width:1150px;margin:auto}.cab{display:flex;justify-content:space-between;gap:15px;align-items:center}h1{margin:0;font-size:1.45rem}.sub{margin:5px 0 0;opacity:.9}.api{background:#ffffff25;padding:7px 10px;border-radius:999px;font-size:.84rem}main{max-width:1150px;margin:auto;padding:20px}.hero{display:grid;grid-template-columns:1.4fr .6fr;gap:18px}.panel{background:#fff;border-radius:18px;padding:20px;box-shadow:0 8px 28px #00000018}.panel h2{margin:0 0 14px;color:var(--g)}.bus{display:grid;grid-template-columns:1fr auto auto;gap:10px}input,select,button{font:inherit;border-radius:11px}input,select{width:100%;padding:13px;border:1px solid #c9c4bf}button{border:0;padding:12px 16px;font-weight:700;cursor:pointer}.pri{background:var(--g);color:white}.sec{background:var(--d);color:white}.light{background:#d6d1ca}.acciones{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.filtros{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.estado{min-height:24px;margin-top:12px;color:#555}.resumen{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.ind{background:var(--b);border-radius:14px;padding:14px;text-align:center}.ind strong{display:block;font-size:1.6rem;color:var(--g)}.resultados{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:15px;margin-top:18px}.card{background:#fff;border:1px solid #e1ddd8;border-radius:16px;padding:17px;box-shadow:0 4px 15px #0000000d}.card h3{margin:0 0 9px;color:var(--g);font-size:1.08rem}.dato{margin:5px 0}.disp{color:var(--v);font-weight:700}.agot{color:var(--r);font-weight:700}.ubi{background:var(--b);padding:9px 10px;border-radius:9px;margin-top:8px}.tag{display:inline-block;background:#eee7df;padding:4px 8px;border-radius:999px;font-size:.78rem;margin-bottom:8px}dialog{width:min(760px,94vw);border:0;border-radius:18px;padding:0;box-shadow:0 25px 70px #0007}dialog::backdrop{background:#0008}.mh{background:var(--g);color:#fff;padding:16px 20px}.mb{padding:20px}video{width:100%;border-radius:14px;background:#111;max-height:58vh}.voz{animation:pulso 1s infinite}@keyframes pulso{50%{opacity:.45}}@media(max-width:820px){.hero{grid-template-columns:1fr}.filtros{grid-template-columns:1fr}}@media(max-width:620px){.bus{grid-template-columns:1fr auto}.buscar{grid-column:1/-1}main{padding:14px}}
</style>
</head>
<body>
<header><div class="wrap cab"><div><h1>Biblioteca Inteligente CMT</h1><p class="sub">Centro de Maestros Tejupilco</p></div><div id="api" class="api">Conectando…</div></div></header>
<main>
<section class="hero">
<div class="panel"><h2>Buscar materiales</h2>
<div class="bus"><input id="q" placeholder="Título, autor, ISBN, editorial o tema"><button id="voz" class="sec" onclick="voz()">🎤 Voz</button><button class="pri buscar" onclick="buscar()">Buscar</button></div>
<div class="acciones"><button class="light" onclick="scanner()">📷 Escanear ISBN</button><button class="light" onclick="limpiar()">🧹 Limpiar</button></div>
<div class="filtros"><select id="fd" onchange="filtrar()"><option value="">Toda disponibilidad</option><option value="si">Con disponibles</option><option value="no">Sin disponibles</option></select><select id="ft" onchange="filtrar()"><option value="">Todos los materiales</option><option>Libro</option><option>Antología</option><option>Audio</option><option>Multimedia</option></select><select id="ord" onchange="filtrar()"><option value="titulo">Ordenar por título</option><option value="disp">Mayor disponibilidad</option><option value="anio">Año más reciente</option></select></div>
<div id="estado" class="estado">Escribe o dicta una consulta.</div></div>
<aside class="panel"><h2>Resumen</h2><div id="resumen" class="resumen"><div class="ind"><strong>—</strong>Títulos</div><div class="ind"><strong>—</strong>Ejemplares</div><div class="ind"><strong>—</strong>Disponibles</div><div class="ind"><strong>—</strong>Sin ubicar</div></div></aside>
</section>
<section id="resultados" class="resultados"></section>
</main>
<dialog id="modal"><div class="mh"><strong>Escanear ISBN</strong></div><div class="mb"><video id="video" autoplay playsinline muted></video><p id="se">Apunta la cámara al código de barras.</p><button class="pri" onclick="cerrar()">Cerrar</button></div></dialog>
<script>
const API='https://script.google.com/macros/s/AKfycbxF802RyGA5EUUqzXmTtrIkSwMakPznVUGKxaSoRAQJIyYyzEPkHkoPlXDDIb3H2x300Q/exec';let original=[],stream=null,activo=false;
function jsonp(p){return new Promise((ok,no)=>{const cb='cb_'+Date.now()+'_'+Math.floor(Math.random()*9999),s=document.createElement('script'),u=new URL(API);Object.entries(p).forEach(([k,v])=>u.searchParams.set(k,v));u.searchParams.set('callback',cb);const fin=()=>{delete window[cb];s.remove()};window[cb]=r=>{fin();r&&r.ok?ok(r.datos):no(new Error(r&&r.error||'Error'))};s.onerror=()=>{fin();no(new Error('No se pudo conectar.'))};s.src=u;document.body.appendChild(s)})}
function esc(t){return String(t??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
async function conexion(){try{const r=await jsonp({accion:'resumen'});api.textContent='● Sistema conectado';resumen.innerHTML=`<div class="ind"><strong>${r.titulos}</strong>Títulos</div><div class="ind"><strong>${r.ejemplares}</strong>Ejemplares</div><div class="ind"><strong>${r.disponibles}</strong>Disponibles</div><div class="ind"><strong>${r.sinUbicar}</strong>Sin ubicar</div>`}catch(e){api.textContent='● Sin conexión';estado.textContent=e.message}}
async function buscar(){const v=q.value.trim();if(!v){estado.textContent='Escribe o dicta una consulta.';return}estado.textContent='Buscando…';resultados.innerHTML='';try{original=await jsonp({accion:'buscar',q:v});filtrar()}catch(e){estado.textContent=e.message}}
function filtrar(){let a=[...original],d=fd.value,t=ft.value,o=ord.value;if(d==='si')a=a.filter(x=>+x.disponibles>0);if(d==='no')a=a.filter(x=>+x.disponibles===0);if(t)a=a.filter(x=>x.tipoMaterial===t);if(o==='titulo')a.sort((x,y)=>x.titulo.localeCompare(y.titulo,'es'));if(o==='disp')a.sort((x,y)=>+y.disponibles-+x.disponibles);if(o==='anio')a.sort((x,y)=>+(y.anio||0)-+(x.anio||0));mostrar(a)}
function mostrar(a){estado.textContent=a.length?`${a.length} resultado(s).`:'No se encontraron coincidencias.';resultados.innerHTML=a.map(l=>`<article class="card"><span class="tag">${esc(l.tipoMaterial)}</span><h3>${esc(l.titulo)}</h3><div class="dato"><b>Autor:</b> ${esc(l.autor)}</div><div class="dato"><b>Editorial:</b> ${esc(l.editorial)}</div><div class="dato"><b>Año:</b> ${esc(l.anio)}</div><div class="dato"><b>ISBN:</b> ${esc(l.isbn)}</div><div class="${+l.disponibles>0?'disp':'agot'}">${l.disponibles} disponible(s) de ${l.totalEjemplares}</div>${l.ubicaciones&&l.ubicaciones.length?l.ubicaciones.map(u=>`<div class="ubi">📍 ${esc(u)}</div>`).join(''):'<div class="ubi">📍 Sin ubicación registrada</div>'}</article>`).join('')}
function voz(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){estado.textContent='Usa Chrome o Edge para voz.';return}const r=new R;r.lang='es-MX';r.interimResults=false;r.continuous=false;r.onstart=()=>{voz.classList.add('voz');voz.textContent='🎙 Escuchando';estado.textContent='Habla ahora…'};r.onresult=e=>{q.value=e.results[0][0].transcript;buscar()};r.onerror=e=>estado.textContent='Error de voz: '+e.error;r.onend=()=>{voz.classList.remove('voz');voz.textContent='🎤 Voz'};r.start()}
async function scanner(){const m=document.getElementById('modal');if(!('BarcodeDetector'in window)){se.textContent='Este navegador no admite el escáner. Usa Chrome en Android.';m.showModal();return}try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});video.srcObject=stream;m.showModal();const f=await BarcodeDetector.getSupportedFormats(),p=['ean_13','ean_8','upc_a','upc_e'].filter(x=>f.includes(x)),d=new BarcodeDetector({formats:p.length?p:f});activo=true;const loop=async()=>{if(!activo)return;try{const c=await d.detect(video);if(c.length){activo=false;q.value=c[0].rawValue;se.textContent='ISBN detectado: '+c[0].rawValue;setTimeout(()=>{cerrar();buscar()},700);return}}catch(e){}requestAnimationFrame(loop)};loop()}catch(e){se.textContent='No se pudo abrir la cámara. Revisa permisos.';m.showModal()}}
function cerrar(){activo=false;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}video.srcObject=null;modal.close()}
function limpiar(){original=[];q.value='';resultados.innerHTML='';estado.textContent='Escribe o dicta una consulta.'}
q.addEventListener('keydown',e=>{if(e.key==='Enter')buscar()});window.addEventListener('load',conexion);
</script>
</body></html>
