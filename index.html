<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Biblioteca Inteligente CMT</title>
<style>
:root{--guinda:#56212F;--dorado:#977E5B;--fondo:#F5F2EE;--verde:#247A3B;--rojo:#AE2E24}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--fondo);color:#222}
header{background:var(--guinda);color:#fff;padding:18px 22px}header h1{margin:0;font-size:1.4rem}header p{margin:5px 0 0;opacity:.85}
main{max-width:1200px;margin:auto;padding:18px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
button{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}.tab{background:#ddd}.tab.activa,.primario{background:var(--guinda);color:#fff}.secundario{background:var(--dorado);color:#fff}
.panel{background:#fff;border-radius:16px;padding:18px;box-shadow:0 6px 20px rgba(0,0,0,.08);margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.fila{display:flex;gap:8px;flex-wrap:wrap}
input,select{width:100%;padding:12px;border:1px solid #bbb;border-radius:10px;font:inherit}.resultados{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:13px;margin-top:15px}.card{border:1px solid #ddd;border-radius:14px;padding:15px;background:#fff}.card h3{color:var(--guinda);margin:0 0 8px}.estado{margin-top:10px;color:#555}.ok{color:var(--verde);font-weight:700}.error{color:var(--rojo);font-weight:700}.oculto{display:none}.api-status{padding:9px 12px;border-radius:10px;background:rgba(255,255,255,.14);display:inline-block;margin-top:10px}
@media(max-width:700px){.grid,.grid4{grid-template-columns:1fr}.fila>*{width:100%}}
</style>
</head>
<body>
<header>
<h1>Biblioteca Inteligente CMT</h1>
<p>Usuarios, préstamos, devoluciones y ubicaciones</p>
<div id="estadoApi" class="api-status">Comprobando backend…</div>
</header>
<main>
<div class="tabs">
<button class="tab activa" onclick="ver('catalogo',this)">Catálogo</button>
<button class="tab" onclick="ver('usuarios',this)">Usuarios</button>
<button class="tab" onclick="ver('prestamos',this)">Préstamos</button>
<button class="tab" onclick="ver('devoluciones',this)">Devoluciones</button>
<button class="tab" onclick="ver('ubicaciones',this)">Ubicaciones</button>
</div>
<section id="catalogo" class="panel"><h2>Buscar libros</h2><div class="fila"><input id="qLibro" placeholder="Título, autor o ISBN"><button class="primario" onclick="buscarLibro()">Buscar</button></div><div id="estadoLibro" class="estado"></div><div id="resLibros" class="resultados"></div></section>
<section id="usuarios" class="panel oculto"><h2>Registrar usuario</h2><div class="grid"><input id="uNombre" placeholder="Nombre completo"><select id="uTipo"><option>Docente</option><option>Estudiante</option><option>Administrativo</option><option>Visitante</option></select><input id="uInstitucion" placeholder="Institución"><input id="uTelefono" placeholder="Teléfono"><input id="uCorreo" placeholder="Correo"><input id="uObs" placeholder="Observaciones"></div><div style="margin-top:10px"><input id="claveUsuarios" type="password" placeholder="Clave administrativa"></div><button class="primario" style="margin-top:10px" onclick="registrarUsuario()">Guardar usuario</button><div id="estadoUsuario" class="estado"></div></section>
<section id="prestamos" class="panel oculto"><h2>Registrar préstamo</h2><div class="grid"><input id="pEjemplar" placeholder="Código de ejemplar, ejemplo CMT-0000001"><input id="pUsuario" placeholder="Código de usuario, ejemplo USR-000001"><input id="pDias" type="number" value="7" min="1" placeholder="Días de préstamo"><input id="pResponsable" placeholder="Responsable"></div><div style="margin-top:10px"><input id="clavePrestamo" type="password" placeholder="Clave administrativa"></div><button class="primario" style="margin-top:10px" onclick="registrarPrestamo()">Registrar préstamo</button><div id="estadoPrestamo" class="estado"></div></section>
<section id="devoluciones" class="panel oculto"><h2>Préstamos activos</h2><div class="fila"><input id="qPrestamo" placeholder="Título, usuario, código de préstamo o ejemplar"><input id="claveDevolucion" type="password" placeholder="Clave administrativa"><button class="primario" onclick="cargarPrestamos()">Buscar</button></div><div id="estadoDevolucion" class="estado"></div><div id="listaPrestamos" class="resultados"></div></section>
<section id="ubicaciones" class="panel oculto"><h2>Asignar ubicación</h2><div class="grid4"><input id="ubEjemplar" placeholder="Código de ejemplar"><input id="ubSala" placeholder="Sala"><input id="ubEstante" placeholder="Estante"><input id="ubRepisa" placeholder="Repisa"><input id="ubPosicion" placeholder="Posición"><input id="claveUbicacion" type="password" placeholder="Clave administrativa"></div><button class="primario" style="margin-top:10px" onclick="guardarUbicacion()">Guardar ubicación</button><div id="estadoUbicacion" class="estado"></div></section>
</main>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbys4LU3rtWQ6USt_YFNQuCQwhNnCCFIatwx5exA3pC1OKIQDFRaaNoV1MC9uJbcsQA6IA/exec';
function jsonp(params){return new Promise((resolve,reject)=>{const cb='cb_'+Date.now()+'_'+Math.floor(Math.random()*9999),s=document.createElement('script'),u=new URL(API_URL);Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));u.searchParams.set('callback',cb);const limpiar=()=>{delete window[cb];s.remove()};window[cb]=r=>{limpiar();r&&r.ok?resolve(r.datos):reject(new Error((r&&r.error)||'Error desconocido'))};s.onerror=()=>{limpiar();reject(new Error('No se pudo conectar con Apps Script.'))};s.src=u.toString();document.body.appendChild(s)})}
function esc(t){return String(t??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function ver(id,b){document.querySelectorAll('section').forEach(x=>x.classList.add('oculto'));document.getElementById(id).classList.remove('oculto');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('activa'));b.classList.add('activa')}
async function comprobarVersion(){const e=document.getElementById('estadoApi');try{const r=await jsonp({accion:'version'});e.textContent='Backend conectado: '+(r.version||'versión desconocida');e.className='api-status ok'}catch(err){e.textContent='Backend incorrecto o antiguo: '+err.message;e.className='api-status error'}}
async function buscarLibro(){const q=qLibro.value.trim(),e=estadoLibro;if(!q){e.textContent='Escribe una búsqueda.';return}e.textContent='Buscando…';try{const r=await jsonp({accion:'buscar',q});e.textContent=r.length+' resultado(s).';resLibros.innerHTML=r.map(x=>`<article class="card"><h3>${esc(x.titulo)}</h3><div><b>Autor:</b> ${esc(x.autor)}</div><div><b>Disponibles:</b> ${x.disponibles} de ${x.totalEjemplares}</div>${(x.ejemplaresDisponibles||[]).map(y=>`<div>📘 ${esc(y.idEjemplar)} · ${esc(y.ubicacion)}</div>`).join('')}</article>`).join('')}catch(err){e.textContent=err.message;e.className='estado error'}}
async function registrarUsuario(){const e=estadoUsuario;e.textContent='Guardando…';e.className='estado';try{const r=await jsonp({accion:'registrarUsuario',clave:claveUsuarios.value,nombre:uNombre.value,tipo:uTipo.value,institucion:uInstitucion.value,telefono:uTelefono.value,correo:uCorreo.value,observaciones:uObs.value});e.textContent=r.mensaje+' Código: '+r.idUsuario;e.className='estado ok'}catch(err){e.textContent=err.message;e.className='estado error'}}
async function registrarPrestamo(){const e=estadoPrestamo;e.textContent='Guardando…';e.className='estado';try{const r=await jsonp({accion:'registrarPrestamo',clave:clavePrestamo.value,idEjemplar:pEjemplar.value,idUsuario:pUsuario.value,dias:pDias.value,responsable:pResponsable.value});e.textContent=r.mensaje+' '+r.idPrestamo+'. Fecha límite: '+r.fechaLimite;e.className='estado ok'}catch(err){e.textContent=err.message;e.className='estado error'}}
async function cargarPrestamos(){const e=estadoDevolucion;e.textContent='Cargando…';try{const r=await jsonp({accion:'prestamosActivos',clave:claveDevolucion.value,q:qPrestamo.value});e.textContent=r.length+' préstamo(s) activo(s).';listaPrestamos.innerHTML=r.map(x=>`<article class="card"><h3>${esc(x.titulo)}</h3><div><b>Usuario:</b> ${esc(x.usuario)}</div><div><b>Ejemplar:</b> ${esc(x.idEjemplar)}</div><div><b>Préstamo:</b> ${esc(x.idPrestamo)}</div><div><b>Fecha límite:</b> ${esc(x.fechaLimite)}</div><button class="secundario" style="margin-top:10px" onclick="devolver('${esc(x.idPrestamo)}')">Registrar devolución</button><div id="m_${esc(x.idPrestamo)}" class="estado"></div></article>`).join('')}catch(err){e.textContent=err.message;e.className='estado error'}}
async function devolver(id){const e=document.getElementById('m_'+id);e.textContent='Procesando…';try{const r=await jsonp({accion:'registrarDevolucion',clave:claveDevolucion.value,idPrestamo:id});e.textContent=r.mensaje+' Retraso: '+r.diasRetraso+' día(s).';e.className='estado ok'}catch(err){e.textContent=err.message;e.className='estado error'}}
async function guardarUbicacion(){const e=estadoUbicacion;e.textContent='Guardando…';try{const r=await jsonp({accion:'guardarUbicacion',clave:claveUbicacion.value,idEjemplar:ubEjemplar.value,sala:ubSala.value,estante:ubEstante.value,repisa:ubRepisa.value,posicion:ubPosicion.value});e.textContent=r.mensaje+' '+r.ubicacion;e.className='estado ok'}catch(err){e.textContent=err.message;e.className='estado error'}}
qLibro.addEventListener('keydown',e=>{if(e.key==='Enter')buscarLibro()});window.addEventListener('load',comprobarVersion);
</script>
</body>
</html>
