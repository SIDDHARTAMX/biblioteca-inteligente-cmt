<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Biblioteca Inteligente CMT V5</title>
<style>
:root{--g:#56212F;--d:#977E5B;--b:#DFD0B9;--f:#F5F2EE;--v:#247A3B;--r:#AE2E24}
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:var(--f);color:#222}
header{background:var(--g);color:#fff;padding:18px 22px}header h1{margin:0;font-size:1.35rem}
main{max-width:1200px;margin:auto;padding:20px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
button{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}
.tab{background:#ddd}.tab.activa,.primario{background:var(--g);color:#fff}.secundario{background:var(--d);color:#fff}
.panel{background:#fff;border-radius:16px;padding:18px;box-shadow:0 6px 20px rgba(0,0,0,.08);margin-bottom:16px}
.busqueda{display:grid;grid-template-columns:1fr auto;gap:10px}
input,select{width:100%;padding:12px;border:1px solid #bbb;border-radius:10px;font:inherit}
.resultados{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:16px}
.card{border:1px solid #ddd;border-radius:14px;padding:15px;background:#fff}.card h3{color:var(--g);margin:0 0 8px}
.ubicacion-form{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.estado{margin-top:10px;color:#555}.ok{color:var(--v);font-weight:700}.error{color:var(--r);font-weight:700}
.oculto{display:none}
@media(max-width:700px){.ubicacion-form{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><h1>Biblioteca Inteligente CMT · Ubicaciones</h1></header>
<main>
<div class="tabs">
<button class="tab activa" onclick="ver('consulta',this)">Buscar</button>
<button class="tab" onclick="ver('ubicaciones',this)">Asignar ubicaciones</button>
</div>

<section id="consulta" class="panel">
<h2>Buscar materiales</h2>
<div class="busqueda">
<input id="q" placeholder="Título, autor o ISBN">
<button class="primario" onclick="buscar()">Buscar</button>
</div>
<div id="estadoBusqueda" class="estado"></div>
<div id="resultadosBusqueda" class="resultados"></div>
</section>

<section id="ubicaciones" class="panel oculto">
<h2>Ejemplares sin ubicación</h2>
<div class="busqueda">
<input id="qSinUbicar" placeholder="Filtrar por título, autor o código">
<button class="primario" onclick="cargarSinUbicar()">Cargar</button>
</div>
<div style="margin-top:10px">
<input id="claveAdmin" type="password" placeholder="Clave administrativa">
</div>
<div id="estadoUbicaciones" class="estado"></div>
<div id="listaSinUbicar" class="resultados"></div>
</section>
</main>

<script>
const API_URL='https://script.google.com/macros/s/AKfycbxF802RyGA5EUUqzXmTtrIkSwMakPznVUGKxaSoRAQJIyYyzEPkHkoPlXDDIb3H2x300Q/exec';

function jsonp(params){
 return new Promise((resolve,reject)=>{
  const cb='cb_'+Date.now()+'_'+Math.floor(Math.random()*9999),s=document.createElement('script'),u=new URL(API_URL);
  Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));u.searchParams.set('callback',cb);
  const limpiar=()=>{delete window[cb];s.remove()};
  window[cb]=r=>{limpiar();r&&r.ok?resolve(r.datos):reject(new Error((r&&r.error)||'Error'))};
  s.onerror=()=>{limpiar();reject(new Error('No se pudo conectar.'))};s.src=u;document.body.appendChild(s);
 });
}

function esc(t){return String(t??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}

function ver(id,b){
 document.querySelectorAll('section').forEach(x=>x.classList.add('oculto'));
 document.getElementById(id).classList.remove('oculto');
 document.querySelectorAll('.tab').forEach(x=>x.classList.remove('activa'));b.classList.add('activa');
}

async function buscar(){
 const q=document.getElementById('q').value.trim(),e=document.getElementById('estadoBusqueda');
 if(!q){e.textContent='Escribe una consulta.';return}
 e.textContent='Buscando…';
 try{
  const r=await jsonp({accion:'buscar',q});
  e.textContent=`${r.length} resultado(s).`;
  document.getElementById('resultadosBusqueda').innerHTML=r.map(x=>`
   <article class="card"><h3>${esc(x.titulo)}</h3>
   <div><b>Autor:</b> ${esc(x.autor)}</div>
   <div><b>Disponibles:</b> ${x.disponibles} de ${x.totalEjemplares}</div>
   ${(x.ubicaciones&&x.ubicaciones.length)?x.ubicaciones.map(u=>`<div>📍 ${esc(u)}</div>`).join(''):'<div>📍 Sin ubicación</div>'}
   </article>`).join('');
 }catch(err){e.textContent=err.message}
}

async function cargarSinUbicar(){
 const clave=document.getElementById('claveAdmin').value.trim();
 const q=document.getElementById('qSinUbicar').value.trim();
 const e=document.getElementById('estadoUbicaciones');
 if(!clave){e.textContent='Escribe la clave administrativa.';return}
 e.textContent='Cargando…';
 try{
  const r=await jsonp({accion:'sinUbicar',clave,q,limite:100});
  e.textContent=`${r.length} ejemplar(es) sin ubicar.`;
  document.getElementById('listaSinUbicar').innerHTML=r.map(x=>`
   <article class="card" id="card_${esc(x.idEjemplar)}">
    <h3>${esc(x.titulo)}</h3>
    <div><b>Código:</b> ${esc(x.idEjemplar)}</div>
    <div><b>Autor:</b> ${esc(x.autor)}</div>
    <div class="ubicacion-form">
      <input id="s_${esc(x.idEjemplar)}" placeholder="Sala">
      <input id="e_${esc(x.idEjemplar)}" placeholder="Estante">
      <input id="r_${esc(x.idEjemplar)}" placeholder="Repisa">
      <input id="p_${esc(x.idEjemplar)}" placeholder="Posición">
    </div>
    <button class="secundario" style="margin-top:10px" onclick="guardarUbicacion('${esc(x.idEjemplar)}')">Guardar ubicación</button>
    <div id="m_${esc(x.idEjemplar)}" class="estado"></div>
   </article>`).join('');
 }catch(err){e.textContent=err.message}
}

async function guardarUbicacion(id){
 const clave=document.getElementById('claveAdmin').value.trim();
 const mensaje=document.getElementById('m_'+id);
 const datos={
  accion:'guardarUbicacion',clave,idEjemplar:id,
  sala:document.getElementById('s_'+id).value.trim(),
  estante:document.getElementById('e_'+id).value.trim(),
  repisa:document.getElementById('r_'+id).value.trim(),
  posicion:document.getElementById('p_'+id).value.trim()
 };
 mensaje.textContent='Guardando…';mensaje.className='estado';
 try{
  const r=await jsonp(datos);
  mensaje.textContent=r.mensaje+' '+r.ubicacion;mensaje.className='estado ok';
  setTimeout(()=>document.getElementById('card_'+id)?.remove(),800);
 }catch(err){mensaje.textContent=err.message;mensaje.className='estado error'}
}

document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')buscar()});
</script>
</body>
</html>
